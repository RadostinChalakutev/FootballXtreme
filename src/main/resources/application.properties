spring.config.import=optional:classpath:client.properties,optional:file:./config/application.properties,optional:file:./config/client.properties
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=${app.time-zone}

spring.flyway.enabled=true
# The first Flyway-enabled release upgrades an existing Hibernate-managed schema.
# LegacySchemaBaselineGuard permits baselining only the known legacy table layout.
# Empty databases still run V1 normally; existing Flyway history is left intact.
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=1
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD}
app.time-zone=Europe/Sofia
app.demo-data.enabled=${DEMO_DATA_ENABLED:false}
server.port=${PORT:8080}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.forward-headers-strategy=framework
server.error.include-message=never
server.error.include-stacktrace=never

management.endpoint.health.show-details=never
management.endpoints.web.exposure.include=health,info
